[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "aqef"
version = "1.1.0"
description = "AI Agentic Quality Engineering Framework — reference implementation"
requires-python = ">=3.10"
dependencies = ["pyyaml>=6.0"]

[project.scripts]
aqef = "aqef.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "-q"
